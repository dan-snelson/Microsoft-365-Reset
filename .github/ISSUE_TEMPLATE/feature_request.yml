name: Feature Request
description: Suggest improvement for Microsoft 365 Reset
title: "[Feature]: "
labels: ["enhancement"]
assignees: "dan-snelson"
body:
  - type: markdown
    attributes:
      value: |
        Microsoft 365 Reset intentionally keeps its operation model, mode handling, and MOFA/package-era parity tight.

        Requests are welcome, but changes that alter workflow semantics, add dependencies, or expand the CLI surface need a clear operational case.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe operator or end-user pain in concrete terms.
      placeholder: |
        Example: Operators need clearer silent-mode output when `reset_factory` expands dependencies and app repair defers cleanup to a later run.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what Microsoft 365 Reset should do instead.
      placeholder: |
        Example: Add a summary line that lists original operation IDs, resolved operation IDs, and any deferred cleanup items before execution starts.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Include workarounds, adjacent tools, or partial solutions you already tried.

  - type: dropdown
    id: scope
    attributes:
      label: Which part of the project would this affect most?
      options:
        - self-service workflow
        - silent workflow
        - test or debug workflow
        - CLI arguments or Jamf parameter mapping
        - Operation IDs or dependency resolution
        - Microsoft app repair or reinstall
        - Microsoft 365 reset or cleanup behavior
        - Microsoft 365 removal behavior
        - Acrobat add-in removal
        - MOFA parity or maintainer report
        - Logging or exit codes
        - README or examples
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most?
      options:
        - Operators / Mac Admins
        - End-users
        - Maintainers
        - More than one group
    validations:
      required: true

  - type: dropdown
    id: parity
    attributes:
      label: Should this preserve current MOFA or package-era behavior?
      options:
        - Preserve current MOFA behavior
        - Preserve retained package-era behavior
        - Intentionally change existing behavior
        - Not sure
    validations:
      required: true

  - type: input
    id: operation-ids
    attributes:
      label: Operation ID(s), if relevant
      description: List affected operation IDs.
      placeholder: "e.g. reset_factory, reset_teams, remove_office"

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Add screenshots, sample commands, deployment constraints, or documentation notes.
